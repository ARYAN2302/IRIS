seed: 42
project_name: iris

data:
  raw_dir: data/raw
  processed_dir: data/processed
  manifests_dir: data/manifests

preprocess:
  sample_rate: 1.0
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  center: true
  normalize: true

training:
  batch_size: 64
  num_workers: 4
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  device: cuda

model:
  encoder_channels: [32, 64, 128, 256]
  predictor_hidden_dim: 512
  embedding_dim: 256

loss:
  sigreg_weight: 1.0
